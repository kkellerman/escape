<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Jeep Wrangler style all-terrain wheel and tire icon">
  <defs>
    <radialGradient id="tireGrad" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="58%" stop-color="#252525"/>
      <stop offset="100%" stop-color="#151515"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a7a7a"/>
      <stop offset="45%" stop-color="#404040"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9b9b9"/>
      <stop offset="55%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#292929"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <g id="treadBlock">
      <path d="M235 17 L277 17 L291 44 L270 69 L242 69 L221 44 Z" fill="#232323" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
      <path d="M247 27 L266 27 L275 43 L264 56 L248 56 L237 43 Z" fill="none" stroke="#444" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g id="spoke">
      <path d="M244 105 L268 105 L286 229 L267 251 L245 251 L226 229 Z" fill="url(#metalGrad)" stroke="#b8b8b8" stroke-width="3" stroke-linejoin="round"/>
      <path d="M250 119 L262 119 L275 221 L263 236 L249 236 L237 221 Z" fill="#565656" opacity="0.55"/>
    </g>
  </defs>

  <!-- Transparent background: no background rectangle is drawn. -->

  <!-- Chunky all-terrain tire tread -->
  <g filter="url(#softShadow)">
    <use href="#treadBlock" transform="rotate(0 256 256)"/>
    <use href="#treadBlock" transform="rotate(18 256 256)"/>
    <use href="#treadBlock" transform="rotate(36 256 256)"/>
    <use href="#treadBlock" transform="rotate(54 256 256)"/>
    <use href="#treadBlock" transform="rotate(72 256 256)"/>
    <use href="#treadBlock" transform="rotate(90 256 256)"/>
    <use href="#treadBlock" transform="rotate(108 256 256)"/>
    <use href="#treadBlock" transform="rotate(126 256 256)"/>
    <use href="#treadBlock" transform="rotate(144 256 256)"/>
    <use href="#treadBlock" transform="rotate(162 256 256)"/>
    <use href="#treadBlock" transform="rotate(180 256 256)"/>
    <use href="#treadBlock" transform="rotate(198 256 256)"/>
    <use href="#treadBlock" transform="rotate(216 256 256)"/>
    <use href="#treadBlock" transform="rotate(234 256 256)"/>
    <use href="#treadBlock" transform="rotate(252 256 256)"/>
    <use href="#treadBlock" transform="rotate(270 256 256)"/>
    <use href="#treadBlock" transform="rotate(288 256 256)"/>
    <use href="#treadBlock" transform="rotate(306 256 256)"/>
    <use href="#treadBlock" transform="rotate(324 256 256)"/>
    <use href="#treadBlock" transform="rotate(342 256 256)"/>
  </g>

  <!-- Tire sidewall ring with transparent center cutout -->
  <path fill="url(#tireGrad)" fill-rule="evenodd" d="
    M256 35
    A221 221 0 1 1 255.9 35
    M256 105
    A151 151 0 1 0 256.1 105 Z"/>
  <circle cx="256" cy="256" r="207" fill="none" stroke="#5a5a5a" stroke-width="3"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="#4a4a4a" stroke-width="5"/>
  <circle cx="256" cy="256" r="151" fill="none" stroke="#777" stroke-width="2"/>

  <!-- Sidewall lettering -->
  <path id="topTextPath" d="M105 254 A151 151 0 0 1 407 254" fill="none"/>
  <text font-family="Arial Black, Impact, sans-serif" font-size="28" letter-spacing="2" fill="#383838" stroke="#5d5d5d" stroke-width="1">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">ALL-TERRAIN</textPath>
  </text>
  <path id="bottomTextPath" d="M407 274 A151 151 0 0 1 105 274" fill="none"/>
  <text font-family="Arial Black, Impact, sans-serif" font-size="22" letter-spacing="2" fill="#373737" stroke="#5d5d5d" stroke-width="1">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">LT285/70R17</textPath>
  </text>

  <!-- Outer rim ring; center and openings remain transparent because only rings/spokes are drawn -->
  <circle cx="256" cy="256" r="134" fill="none" stroke="url(#edgeGrad)" stroke-width="15"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="#454545" stroke-width="8"/>

  <!-- Wrangler-like alloy spokes -->
  <g filter="url(#softShadow)">
    <use href="#spoke" transform="rotate(0 256 256)"/>
    <use href="#spoke" transform="rotate(60 256 256)"/>
    <use href="#spoke" transform="rotate(120 256 256)"/>
    <use href="#spoke" transform="rotate(180 256 256)"/>
    <use href="#spoke" transform="rotate(240 256 256)"/>
    <use href="#spoke" transform="rotate(300 256 256)"/>
  </g>

  <!-- Center hub and lug nuts -->
  <circle cx="256" cy="256" r="54" fill="#343434" stroke="#8a8a8a" stroke-width="4"/>
  <circle cx="256" cy="256" r="34" fill="url(#metalGrad)" stroke="#b0b0b0" stroke-width="3"/>
  <text x="256" y="266" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="22" fill="#2e2e2e" stroke="#9a9a9a" stroke-width="1">Jeep</text>

  <g id="lug">
    <circle cx="256" cy="202" r="13" fill="#252525" stroke="#777" stroke-width="3"/>
    <circle cx="256" cy="202" r="8" fill="url(#edgeGrad)" stroke="#d0d0d0" stroke-width="1"/>
  </g>
  <use href="#lug" transform="rotate(60 256 256)"/>
  <use href="#lug" transform="rotate(120 256 256)"/>
  <use href="#lug" transform="rotate(180 256 256)"/>
  <use href="#lug" transform="rotate(240 256 256)"/>
  <use href="#lug" transform="rotate(300 256 256)"/>

  <!-- Valve stem -->
  <rect x="249" y="390" width="14" height="24" rx="5" fill="#2c2c2c" stroke="#9b9b9b" stroke-width="2"/>
  <circle cx="256" cy="390" r="7" fill="#3a3a3a" stroke="#aaa" stroke-width="2"/>
</svg>
